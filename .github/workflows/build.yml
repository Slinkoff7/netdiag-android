name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Android SDK directory and licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          cp -r /usr/local/lib/android/sdk/platforms "$ANDROID_HOME/" 2>/dev/null || true
          cp -r /usr/local/lib/android/sdk/build-tools "$ANDROID_HOME/" 2>/dev/null || true
          cp -r /usr/local/lib/android/sdk/platform-tools "$ANDROID_HOME/" 2>/dev/null || true

      - name: Create minimal Android project if missing
        run: |
          if [ ! -f "gradlew" ]; then
            mkdir -p app/src/main/java/com/example/netdiag app/src/main/res/layout app/src/main/res/values
            cat << 'EOF' > settings.gradle
            rootProject.name = "NetDiag"
            include ':app'
            EOF

            cat << 'EOF' > build.gradle
            plugins {
                id 'com.android.application' version '8.2.2' apply false
                id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
            }
            EOF

            cat << 'EOF' > gradle.properties
            org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
            android.useAndroidX=true
            EOF

            cat << 'EOF' > app/build.gradle
            plugins {
                id 'com.android.application'
                id 'org.jetbrains.kotlin.android'
            }

            android {
                namespace 'com.example.netdiag'
                compileSdk 34

                defaultConfig {
                    applicationId "com.example.netdiag"
                    minSdk 24
                    targetSdk 34
                    versionCode 1
                    versionName "1.0"
                }

                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
                kotlinOptions {
                    jvmTarget = '17'
                }
            }

            dependencies {
                implementation 'androidx.core:core-ktx:1.12.0'
                implementation 'androidx.appcompat:appcompat:1.6.1'
                implementation 'com.google.android.material:material:1.11.0'
                implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
            }
            EOF

            cat << 'EOF' > app/src/main/res/values/strings.xml
            <resources>
                <string name="app_name">NetDiag</string>
            </resources>
            EOF

            gradle wrapper --gradle-version 8.4
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetDiag-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
